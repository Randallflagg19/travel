name: Deploy backend to production VPS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref already accepted on staging
        required: true
        default: main
        type: string
      run_migrations:
        description: Выполнить миграции БД (требуется отдельное подключение для миграций)
        required: false
        default: false
        type: boolean

concurrency:
  group: travel-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: backend/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: backend
      - run: yarn lint
        working-directory: backend
      - run: yarn build
        working-directory: backend
      - name: Package release
        id: release
        working-directory: backend
        run: |
          rm -rf node_modules
          yarn install --frozen-lockfile --production=true
          release_id="$(git -C .. rev-parse HEAD)"
          release_dir="$RUNNER_TEMP/travel-backend-release"
          mkdir -p "$release_dir"
          cp -R dist node_modules package.json yarn.lock "$release_dir/"
          tar -C "$release_dir" -czf "$RUNNER_TEMP/$release_id.tar.gz" .
          echo "id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TRAVEL_VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TRAVEL_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload and activate release
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
          RUN_DB_MIGRATIONS: ${{ inputs.run_migrations && 'true' || 'false' }}
          VPS_HOST: ${{ secrets.TRAVEL_VPS_HOST }}
          VPS_USER: ${{ secrets.TRAVEL_VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'mkdir -p ~/travel-backend/incoming ~/travel-backend/releases'
          scp "$RUNNER_TEMP/$RELEASE_ID.tar.gz" "$VPS_USER@$VPS_HOST:~/travel-backend/incoming/$RELEASE_ID.tar.gz"
          ssh "$VPS_USER@$VPS_HOST" "RELEASE_ID=$RELEASE_ID RUN_DB_MIGRATIONS=$RUN_DB_MIGRATIONS bash -s" <<'REMOTE'
            set -euo pipefail
            root="$HOME/travel-backend"; release="$root/releases/$RELEASE_ID"; archive="$root/incoming/$RELEASE_ID.tar.gz"
            previous=""
            if [ -L "$root/current" ]; then previous="$(readlink -f "$root/current")"; fi
            mkdir -p "$release"; tar -xzf "$archive" -C "$release"
            secrets_dir="$HOME/travel-secrets"
            # systemd loads the DB file, then the backend file, over the unit environment.
            /usr/bin/systemctl show travel-backend.service --property=Environment --value | node -e '
              const { readFileSync } = require("node:fs");
              const { parseEnv } = require("node:util");
              const unitEnv = readFileSync(0, "utf8");
              const files = process.argv.slice(1);
              const settings = Object.assign({}, ...files.map(file => parseEnv(readFileSync(file, "utf8"))));
              const inline = unitEnv.match(/(?:^|\s)DB_MIGRATE_ON_START=(true|false)(?=\s|$)/)?.[1];
              if ((settings.DB_MIGRATE_ON_START ?? inline) !== "false") {
                console.error("Set DB_MIGRATE_ON_START=false for travel-backend.service before deploying.");
                process.exit(1);
              }
            ' "$secrets_dir/travel-prod-db.env" "$secrets_dir/travel-prod-backend.env"
            if [ "${RUN_DB_MIGRATIONS:-false}" = "true" ]; then
              migration_env="$secrets_dir/travel-prod-migrations.env"
              if [ ! -r "$migration_env" ]; then
                echo "Missing $migration_env. Apply migrations manually and leave run_migrations unchecked." >&2
                exit 1
              fi
              echo "Applying database migrations before release activation"
              env -u DATABASE_URL -u DB_SSL node --env-file="$migration_env" "$release/dist/db/migrate.js"
            fi
            ln -sfn "$release" "$root/current"
            if ! sudo /usr/bin/systemctl restart travel-backend.service; then
              if [ -n "$previous" ]; then
                ln -sfn "$previous" "$root/current"
                sudo /usr/bin/systemctl restart travel-backend.service
              fi
              exit 1
            fi
            for _ in $(seq 1 15); do
              if curl -fsS --max-time 5 http://127.0.0.1:3010/api/health >/dev/null; then
                rm -f "$archive"
                exit 0
              fi
              sleep 2
            done
            if [ -n "$previous" ]; then
              ln -sfn "$previous" "$root/current"
              sudo /usr/bin/systemctl restart travel-backend.service
            fi
            exit 1
          REMOTE
